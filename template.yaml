AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: arXiv research assistant - Phase 1 (daily ingestion, query API, web UI)

Parameters:
  VectorBucketName:
    Type: String
    Default: vv-arxiv-vectors
  VectorIndexName:
    Type: String
    Default: abstracts-v1
  LlmModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
  ContactEmail:
    Type: String
    Description: Sent to arXiv in the User-Agent header, as their API terms ask
  AlertEmail:
    Type: String
    Description: Where to send an email when a pipeline run fails for good
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Websites allowed to call the API from a browser (CORS)
    Default: "https://vaibhavarshney.github.io,http://localhost:8000"

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    CodeUri: app/
    MemorySize: 1024
    Environment:
      Variables:
        VECTOR_BUCKET: !Ref VectorBucketName
        VECTOR_INDEX: !Ref VectorIndexName
        LLM_MODEL_ID: !Ref LlmModelId
        CONTACT_EMAIL: !Ref ContactEmail
        # Built from a fixed pattern instead of !Ref RawBucket. The bucket's S3 trigger points
        # at IndexFunction, so if the functions also pointed back at the bucket, CloudFormation
        # would hit a circular dependency and refuse to deploy.
        RAW_BUCKET: !Sub "arxiv-rag-raw-${AWS::AccountId}"

Resources:
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "arxiv-rag-raw-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------- 1) Fetch
  FetchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.fetch_handler
      Timeout: 300
      MemorySize: 256            # used ~100 MB in Step 4
      LoggingConfig:
        LogGroup: !Ref FetchLogs
      Policies:
        - S3WritePolicy:
            BucketName: !Sub "arxiv-rag-raw-${AWS::AccountId}"
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FailedRunsQueue.QueueName
      # Async invocations (schedules, S3 events) retry on failure, then land in the dead-letter queue.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailedRunsQueue.Arn
      Events:
        DailyFetch:
          Type: ScheduleV2       # EventBridge Scheduler
          Properties:
            # arXiv announces new papers around 8 pm ET, Sunday to Thursday. Run 2 hours after.
            ScheduleExpression: "cron(0 22 ? * SUN-THU *)"
            ScheduleExpressionTimezone: America/New_York
            # 4-day window covers weekends and API lag. Overlap is free: the indexer skips repeats.
            Input: '{"days": 4, "max": 1500}'

  # ---------------------------------------------------------------- 2) Index
  IndexFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.index_handler
      Timeout: 900
      LoggingConfig:
        LogGroup: !Ref IndexLogs
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "arxiv-rag-raw-${AWS::AccountId}"
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FailedRunsQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
            - Effect: Allow
              # GetVectors lets us check which papers are already indexed before embedding.
              Action: [s3vectors:PutVectors, s3vectors:GetVectors]
              Resource: !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucketName}/index/${VectorIndexName}"
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailedRunsQueue.Arn
      Events:
        NewRawFile:
          Type: S3
          Properties:
            Bucket: !Ref RawBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
                  - Name: suffix
                    Value: .jsonl

  # ---------------------------------------------------------------- 3) Query
  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.query_handler
      Timeout: 29                # API Gateway gives up at 30 s, so there's no point running longer
      Events:
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ask
            Method: POST
      LoggingConfig:
        LogGroup: !Ref QueryLogs
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/*"
            - Effect: Allow
              Action: [s3vectors:QueryVectors, s3vectors:GetVectors]
              Resource: !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucketName}/index/${VectorIndexName}"

  # ---------------------------------------------------------------- Public API
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      # CORS: which websites a *browser* will let call this API. (Not security on its own:
      # tools like curl ignore CORS. The throttling below is what protects your bill.)
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [content-type]
        MaxAge: 600
      # At most 1 request per second on average, with short bursts of 5.
      # Anything above that gets an automatic 429 "Too Many Requests" and never reaches Lambda.
      DefaultRouteSettings:
        ThrottlingRateLimit: 1
        ThrottlingBurstLimit: 5

  # ---------------------------------------------------------------- Failure handling
  # Runs that still fail after all retries end up here, with the original event attached,
  # so you can see what failed and replay it.
  FailedRunsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600   # 14 days

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # Fires as soon as anything lands in the dead-letter queue.
  FailedRunsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An arXiv pipeline run failed after all retries. Check the FailedRunsQueue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FailedRunsQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  FetchLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /arxiv-rag/fetch
      RetentionInDays: 14
  IndexLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /arxiv-rag/index
      RetentionInDays: 14
  QueryLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /arxiv-rag/query
      RetentionInDays: 14

Outputs:
  RawBucketName:
    Value: !Ref RawBucket
  FetchFunctionName:
    Value: !Ref FetchFunction
  IndexFunctionName:
    Value: !Ref IndexFunction
  QueryFunctionName:
    Value: !Ref QueryFunction
  FailedRunsQueueUrl:
    Value: !Ref FailedRunsQueue
  ApiUrl:
    Description: Paste this into docs/index.html as API_URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/ask"
