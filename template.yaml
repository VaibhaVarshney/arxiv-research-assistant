AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: arXiv research assistant - Phase 1 (fetch, index, query Lambdas)

# Values you can change at deploy time without editing this file.
Parameters:
  VectorBucketName:
    Type: String
    Default: vv-arxiv-vectors
  VectorIndexName:
    Type: String
    Default: abstracts-v1
  LlmModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
  ContactEmail:
    Type: String
    Description: Sent to arXiv in the User-Agent header, as their API terms ask

# Settings shared by every function.
Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    CodeUri: app/
    MemorySize: 1024
    Environment:
      Variables:
        VECTOR_BUCKET: !Ref VectorBucketName
        VECTOR_INDEX: !Ref VectorIndexName
        LLM_MODEL_ID: !Ref LlmModelId
        CONTACT_EMAIL: !Ref ContactEmail
        RAW_BUCKET: !Ref RawBucket

Resources:
  # Raw JSONL files from arXiv land here. Private, encrypted by default.
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "arxiv-rag-raw-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 1) arXiv -> S3. Mostly waiting on arXiv's 3-second rate limit, so little memory is needed.
  FetchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.fetch_handler
      Timeout: 300
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref FetchLogs
      Policies:
        - S3WritePolicy:
            BucketName: !Ref RawBucket

  # 2) S3 -> embeddings -> S3 Vectors.
  IndexFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.index_handler
      Timeout: 900
      LoggingConfig:
        LogGroup: !Ref IndexLogs
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref RawBucket
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
            - Effect: Allow
              Action: s3vectors:PutVectors
              Resource: !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucketName}/index/${VectorIndexName}"

  # 3) question -> retrieve -> LLM -> cited answer.
  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.query_handler
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref QueryLogs
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Embedding model for the question
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
                # Cross-region inference profiles route to models in several US regions,
                # so the role needs both the profile and the underlying models.
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/*"
            - Effect: Allow
              # GetVectors is required because we use filters and returnMetadata.
              Action: [s3vectors:QueryVectors, s3vectors:GetVectors]
              Resource: !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${VectorBucketName}/index/${VectorIndexName}"

  # Logs auto-delete after 2 weeks instead of piling up forever.
  FetchLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /arxiv-rag/fetch
      RetentionInDays: 14
  IndexLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /arxiv-rag/index
      RetentionInDays: 14
  QueryLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /arxiv-rag/query
      RetentionInDays: 14

Outputs:
  RawBucketName:
    Value: !Ref RawBucket
  FetchFunctionName:
    Value: !Ref FetchFunction
  IndexFunctionName:
    Value: !Ref IndexFunction
  QueryFunctionName:
    Value: !Ref QueryFunction
